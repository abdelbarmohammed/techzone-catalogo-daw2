<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="256" viewBox="0 0 1180 256">
  <defs>
    <linearGradient id="gradMain" x1="42" y1="40" x2="214" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradT" x1="80" y1="90" x2="176" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradDot" x1="60" y1="40" x2="160" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <mask id="notchMask">
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <!-- tiny pixel notch cut out -->
      <rect x="196" y="64" width="18" height="18" rx="3" fill="black"/>
    </mask>
  </defs>
  <g transform="translate(32,0)">
    <g>

  <!-- Ring G -->
  <g mask="url(#notchMask)">
    <path fill="url(#gradMain)" fill-rule="evenodd" d="
      M 128 26
      L 214 76 L 214 160 L 128 210 L 42 160 L 42 76 Z
      M 128 72
      L 176 100 L 176 136 L 128 164 L 80 136 L 80 100 Z
    "/>
    <polygon points="176,116 214,138 214,152 176,130" fill="url(#gradMain)"/>
  </g>

  <!-- Dot-matrix bevel accent -->
  <g><circle cx="70" cy="82" r="5" fill="url(#gradDot)" opacity="0.90"/>
    <circle cx="84" cy="74" r="5" fill="url(#gradDot)" opacity="0.82"/>
    <circle cx="98" cy="66" r="5" fill="url(#gradDot)" opacity="0.74"/>
    <circle cx="112" cy="58" r="4" fill="url(#gradDot)" opacity="0.66"/>
    <circle cx="126" cy="50" r="4" fill="url(#gradDot)" opacity="0.58"/>
    <circle cx="140" cy="52" r="4" fill="url(#gradDot)" opacity="0.50"/>
    <circle cx="154" cy="60" r="3" fill="url(#gradDot)" opacity="0.42"/></g>

  <!-- Inner T (GT monogram) -->
  <g>
    <rect x="92" y="102" width="72" height="22" rx="10" fill="url(#gradT)"/>
    <rect x="118" y="118" width="20" height="50" rx="10" fill="url(#gradT)"/>
  </g>
</g>
    <text x="310" y="154"
          font-family="Space Grotesk, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="92"
          font-weight="600"
          letter-spacing="-2"
          fill="#e8e8ee">Galería</text>
    <text x="632" y="154"
          font-family="Space Grotesk, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="92"
          font-weight="600"
          letter-spacing="-2"
          fill="#3b82f6">Tech</text>
  </g>
</svg>
